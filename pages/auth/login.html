<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống quản lý học vụ</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #EEF2F6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1E293B;
    }

    /* KHỐI BRANDING Ở TRÊN THẺ ĐĂNG NHẬP */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-wrap {
      width: 72px;
      height: 72px;
      background: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 54, 93, 0.12);
      border: 1px solid rgba(0, 54, 93, 0.08);
      margin-bottom: 12px;
      padding: 10px;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-school-tag {
      font-size: 12px;
      font-weight: 700;
      color: #0284C7;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-system-name {
      font-size: 17px;
      font-weight: 700;
      color: #00365D;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.3;
    }

    /* THẺ ĐĂNG NHẬP CHÍNH (CARD) */
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 4px;
      box-shadow: 0 6px 24px rgba(0, 54, 93, 0.08);
      border: 1px solid #E2E8F0;
      padding: 32px 36px 36px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: #00365D;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 24px;
    }

    /* FORM INPUTS */
    .form-group {
      margin-bottom: 14px;
    }

    .form-control {
      width: 100%;
      height: 42px;
      padding: 10px 14px;
      font-size: 13.5px;
      color: #1E293B;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      border-color: #0284C7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .form-control::placeholder {
      color: #94A3B8;
    }

    .password-wrap {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-password:hover {
      color: #00365D;
    }

    /* NÚT ĐĂNG NHẬP: MÀU GIỐNG SIDEBAR (#9fd7f9) */
    .btn-login {
      width: 100%;
      height: 42px;
      background-color: #9FD7F9;
      color: #00365D;
      border: 1px solid #7DC7F7;
      border-radius: 3px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-login:hover {
      background-color: #85CBF7;
      border-color: #58B4F3;
      box-shadow: 0 3px 10px rgba(110, 194, 247, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* NÚT GOOGLE */
    .btn-google {
      width: 100%;
      height: 40px;
      background: #FFFFFF;
      color: #005696;
      border: 1px solid #005696;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-google:hover {
      background: #F8FAFC;
      border-color: #00365D;
      color: #00365D;
    }

    /* FOOTER CARD */
    .card-footer-row {
      display: flex;
      justify-content: flex-start;
      margin-top: 14px;
      padding-top: 6px;
    }

    .forgot-link {
      font-size: 11.5px;
      color: #64748B;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .forgot-link:hover {
      color: #00365D;
      text-decoration: underline;
    }

    /* FOOTER BẢN QUYỀN NGOÀI CARD */
    .page-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #94A3B8;
      text-align: center;
      letter-spacing: 0.2px;
    }

    /* DEMO HINT BOX */
    .demo-hint {
      margin-top: 14px;
      background: #F1F5F9;
      border: 1px dashed #CBD5E1;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 11px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* THÔNG BÁO LỖI TEXT MÀU ĐỎ NẰM PHÍA TRÊN Ô INPUT */
    .field-error-text {
      color: #DC2626;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
      animation: fieldErrorFadeIn 0.15s ease-in-out;
    }
    @keyframes fieldErrorFadeIn {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-control.is-invalid {
      border-color: #DC2626 !important;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.15) !important;
    }
  </style>
</head>
<body>

  <!-- KHỐI LOGO & TÊN HỆ THỐNG QUẢN LÝ HỌC VỤ -->
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="../../assets/logo.svg" onerror="this.src='../assets/logo.svg'" alt="Logo" class="brand-logo-img">
    </div>
        <h1 class="brand-system-name">HỆ THỐNG QUẢN LÝ HỌC VỤ</h1>
  </div>

  <!-- THẺ ĐĂNG NHẬP -->
  <div class="login-card">
    <div class="login-title">ĐĂNG NHẬP</div>
    <div class="login-subtitle">Cổng thông tin đào tạo</div>

    <form id="login-form" novalidate onsubmit="handleLogin(event)">
      <!-- Tên đăng nhập -->
      <div class="form-group">
        <div class="field-error-text" id="username-error" style="display: none;"></div>
        <input 
          type="text" 
          id="username" 
          class="form-control" 
          placeholder="Email hoặc Tên đăng nhập" 
          required 
          autocomplete="username"
        />
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <div class="field-error-text" id="password-error" style="display: none;"></div>
        <div class="password-wrap">
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Mật khẩu" 
            required 
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Ẩn/Hiện mật khẩu">
            <span class="material-symbols-outlined" id="eye-icon" style="font-size: 18px;">visibility</span>
          </button>
        </div>
      </div>

      <!-- Nút Đăng nhập màu giống sidebar (#9FD7F9) -->
      <button type="submit" class="btn-login" id="btn-submit">
        Đăng nhập
      </button>


      <!-- Quên mật khẩu -->
      <div class="card-footer-row">
        <a href="javascript:void(0)" onclick="ApiClient.showToast('info', 'Cấp lại mật khẩu', 'Vui lòng liên hệ Phòng Đào tạo (P.A102) hoặc gửi email tới phongdaotao@quanlyhocvu.edu.vn để được hỗ trợ cấp lại mật khẩu.')" class="forgot-link">
          Quên mật khẩu
        </a>
      </div>
    </form>
  </div>

  <!-- BẢN QUYỀN HỆ THỐNG -->
  <div class="page-footer">
    All Rights Reserved • Hệ thống quản lý học vụ - Nhóm 8
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      ApiClient.clearAllFieldErrors('login-form');
      const inputUser = document.getElementById('username').value.trim();
      const inputPass = document.getElementById('password').value;
      const btnSubmit = document.getElementById('btn-submit');

      let hasError = false;
      if (!inputUser) {
        ApiClient.showFieldError('username', 'Vui lòng nhập email hoặc tên đăng nhập.');
        hasError = true;
      }
      if (!inputPass) {
        ApiClient.showFieldError('password', 'Vui lòng nhập mật khẩu.');
        hasError = true;
      }
      if (hasError) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Đang xác thực với máy chủ...';

      let email = inputUser;
      if (!email.includes('@')) {
        const lower = email.toLowerCase();
        if (lower === 'sv001' || lower === 'SV001' || lower.includes('sinhvien') || lower.includes('student')) {
          email = 'an.nguyen@example.com';
        } else if (lower === 'gv001' || lower === 'gv01' || lower.includes('giangvien') || lower.includes('lecturer')) {
          email = 'binh.tran@example.com';
        } else if (lower === 'troly' || lower === 'giaovu' || lower.includes('troly_cntt')) {
          email = 'cuong.le@example.com';
        } else if (lower === 'truongphong' || lower.includes('truongphong_daotao') || lower === 'admin') {
          email = 'dung.pham@example.com';
        }
      }

      try {
        let res;
        const isStaffHint = email.includes('binh.tran') || email.includes('cuong.le') || email.includes('dung.pham') || 
                            inputUser.toLowerCase().includes('gv') || inputUser.toLowerCase().includes('troly') || inputUser.toLowerCase().includes('truongphong');

        if (isStaffHint) {
          res = await AuthApi.adminLogin(email, inputPass);
          if (!res || !res.success) {
            res = await AuthApi.login(email, inputPass);
          }
        } else {
          res = await AuthApi.login(email, inputPass);
          if (!res || !res.success) {
            res = await AuthApi.adminLogin(email, inputPass);
          }
        }

        if (!res || !res.success || !res.data) {
          const errMsg = res?.message || 'Đăng nhập không thành công. Vui lòng kiểm tra lại tài khoản hoặc mật khẩu.';
          ApiClient.showFieldError('username', errMsg);
          ApiClient.showFieldError('password', 'Vui lòng kiểm tra lại mật khẩu.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Đăng nhập';
          return;
        }

        const { accessToken, user } = res.data;

        localStorage.setItem('auth_access_token', accessToken);
        localStorage.setItem('token', accessToken);
        localStorage.setItem('auth_current_user', JSON.stringify(user));
        localStorage.setItem('currentUser', JSON.stringify(user));
        localStorage.setItem('auth_user_role', user.role);

        let redirectUrl = '../student/dashboard.html';
        if (user.role === 'GIANGVIEN') {
          redirectUrl = '../lecturer/schedule.html';
        } else if (user.role === 'TROLY') {
          redirectUrl = '../assistant/dashboard.html';
        } else if (user.role === 'TRUONGPHONG') {
          redirectUrl = '../headoffice/dashboard.html';
        }

        window.location.href = redirectUrl;
      } catch (err) {
        ApiClient.showFieldError('username', 'Lỗi kết nối máy chủ: ' + err.message);
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Đăng nhập';
      }
    }

  </script>
</body>
</html>
